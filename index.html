<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mansehra Runner</title>
<style>
body{margin:0;background:#222;color:white;text-align:center;font-family:sans-serif}
canvas{background:#444;display:block;margin:10px auto;border:3px solid white}
button{padding:15px 25px;font-size:18px;margin:5px}
</style>
</head>
<body>
<h2>Mansehra Runner</h2>
<p>Score: <span id="score">0</span></p>
<canvas id="game" width="300" height="400"></canvas><br>
<button onclick="move(-1)">⬅️ Left</button>
<button onclick="move(1)">Right ➡️</button>
<p>Car se bacho, school pohancho!</p>
<script>
let c=document.getElementById("game"),x=c.getContext("2d");
let px=130,score=0,cars=[];
function move(d){px+=d*30; if(px<0)px=0; if(px>260)px=260;}
setInterval(()=>{
 x.clearRect(0,0,300,400);
 x.fillStyle="white"; x.fillRect(100,0,10,400); x.fillRect(190,0,10,400);
 x.fillStyle="yellow"; x.fillRect(px,340,40,50);
 if(Math.random()<0.05) cars.push({x:Math.floor(Math.random()*3)*90+10,y:-50});
 for(let car of cars){car.y+=5; x.fillStyle="red"; x.fillRect(car.x,car.y,40,50);
  if(car.y>320 && car.y<390 && Math.abs(car.x-px)<35){alert("Game Over! Score: "+score); score=0; cars=[]; px=130;}}
 cars=cars.filter(car=>car.y<420);
 score++; document.getElementById("score").innerText=score;
},50);
document.addEventListener("keydown",e=>{if(e.key=="ArrowLeft")move(-1); if(e.key=="ArrowRight")move(1);});
</script>
</body>
</html>
